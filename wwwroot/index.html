<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>マルチプレイ・ダブト (連戦対応版)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background-color: #2c3e50;
            color: white;
            margin: 0;
            padding: 20px;
        }

        .area {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            margin: 10px auto;
            border-radius: 10px;
            max-width: 800px;
            min-height: 140px;
        }

        .card {
            display: inline-block;
            width: 65px;
            height: 95px;
            background: white;
            color: black;
            border-radius: 8px;
            margin: 5px;
            line-height: 95px;
            font-size: 24px;
            cursor: pointer;
            user-select: none;
            border: 4px solid transparent;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.2s ease-out;
            position: relative;
        }

            .card.red {
                color: #e74c3c;
            }

            .card.disabled {
                cursor: not-allowed;
                opacity: 0.6;
                filter: grayscale(50%);
            }

            .card.selected {
                border-color: #39ff14;
                transform: translateY(-20px) scale(1.15);
                box-shadow: 0 15px 25px rgba(57, 255, 20, 0.6);
                background-color: #f0fff0;
                z-index: 10;
            }

        input {
            padding: 10px;
            border-radius: 5px;
            font-size: 16px;
            margin: 5px;
            width: 200px;
            text-align: center;
        }

        #status-bar {
            background: #e74c3c;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 5px;
            font-weight: bold;
            display: none;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            margin: 5px;
            cursor: pointer;
            border-radius: 5px;
            border: none;
            background: #3498db;
            color: white;
            transition: 0.2s;
        }

            button:disabled {
                background: #7f8c8d;
                cursor: not-allowed;
                opacity: 0.5;
            }

            button:hover:not(:disabled) {
                background: #2980b9;
                transform: scale(1.05);
            }

        #btn-dabuto {
            background: #e67e22;
        }

        #btn-finish {
            background: #2ecc71;
        }

        #btn-leave {
            background: #c0392b;
        }

            #btn-leave:hover {
                background: #e74c3c;
            }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div id="status-bar"></div>

    <div id="lobby">
        <h1>🃏 通信マルチ・ダブト</h1>
        <div style="background: rgba(0,0,0,0.4); padding: 20px; border-radius: 10px; display: inline-block;">

            <div id="join-form">
                <input type="text" id="username" placeholder="あなたの名前"><br>
                <input type="number" id="room-id" placeholder="ルーム番号 (例: 1234)"><br>
                <button onclick="attemptJoin()" style="margin-top: 15px; width: 100%;">入室 / ルーム作成</button>
            </div>

            <div id="waiting-room" class="hidden">
                <h3 id="current-room-display"></h3>
                <button id="btn-leave" onclick="leaveRoom()">退出する</button>
            </div>

        </div>

        <div id="player-list" style="margin:20px; font-size: 18px;"></div>
        <button id="start-btn" class="hidden" onclick="start()" style="background:#e67e22;">参加者が揃ったら開始！</button>
    </div>

    <div id="game" class="hidden">
        <h2 id="turn-info">サーバー接続中...</h2>

        <div class="area">
            <h4>場札 (山札残り: <span id="deck-count">0</span>)</h4>
            <div id="field"></div>
        </div>

        <div class="area">
            <h4>あなたの手札 (スコア: <span id="score">0</span>)</h4>
            <div id="hand"></div>
        </div>

        <div id="controls">
            <button id="btn-exchange" onclick="action('ExchangeOne')" disabled>選んだ1枚を交換</button>
            <button id="btn-all" onclick="action('ExchangeAll')" disabled>全交換</button>
            <button id="btn-pass" onclick="action('Pass')" disabled>パス</button>
            <hr style="border:0.5px solid rgba(255,255,255,0.1); margin:15px;">
            <button id="btn-dabuto" onclick="connection.invoke('DeclareDabuto')" disabled>🔥 ダブト！</button>
            <button id="btn-finish" onclick="connection.invoke('EndTurn')" disabled>手番を終了して次へ</button>
        </div>
    </div>

    <div id="result-screen" class="hidden">
        <h2>ラウンド終了！</h2>
        <div id="results" class="area" style="text-align: left; display: inline-block; padding: 20px 40px;"></div><br>
        <button onclick="start()" style="background:#e67e22; font-weight: bold;">次のラウンドを開始する</button>
        <button onclick="location.reload()" style="background:#7f8c8d;">終了してタイトルへ</button>
    </div>

    <script>
        const connection = new signalR.HubConnectionBuilder()
            .withUrl("/gamehub", { skipNegotiation: true, transport: signalR.HttpTransportType.WebSockets })
            .build();

        let selectedHand = null, selectedField = null;
        let gameState = null;

        async function attemptJoin() {
            const name = document.getElementById('username').value;
            const roomId = document.getElementById('room-id').value;
            if (!name || !roomId) return alert("名前とルーム番号を入れてね！");

            if (connection.state === signalR.HubConnectionState.Disconnected) {
                await connection.start();
            }

            const exists = await connection.invoke("CheckRoom", roomId);
            if (!exists) {
                if (confirm(`ルーム番号【${roomId}】は存在しません。\n新しくこの番号でルームを作成しますか？`)) {
                    await connection.invoke("JoinRoom", name, roomId, true);
                    showWaitingRoom(roomId);
                }
            } else {
                await connection.invoke("JoinRoom", name, roomId, false);
                showWaitingRoom(roomId);
            }
        }

        function showWaitingRoom(roomId) {
            document.getElementById('join-form').classList.add('hidden');
            document.getElementById('waiting-room').classList.remove('hidden');
            document.getElementById('current-room-display').innerText = `ルーム【${roomId}】に入室中`;
        }

        async function leaveRoom() {
            await connection.invoke("LeaveRoom");
            document.getElementById('waiting-room').classList.add('hidden');
            document.getElementById('join-form').classList.remove('hidden');
            document.getElementById('player-list').innerText = "";
            document.getElementById('start-btn').classList.add('hidden');
        }

        connection.on("RoomAborted", message => {
            alert(message);
            location.reload();
        });

        connection.on("UpdatePlayers", players => {
            document.getElementById('player-list').innerText = "現在の参加者: " + players.join(", ");
            if (players.length >= 1) document.getElementById('start-btn').classList.remove('hidden');
        });

        function start() {
            document.getElementById('result-screen').classList.add('hidden'); // 結果画面を隠す
            connection.invoke("StartGame");
        }

        connection.on("ReceiveState", state => {
            gameState = state;

            // 画面の切り替え（ロビーや結果画面からゲーム画面へ）
            document.getElementById('lobby').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('game').classList.remove('hidden');

            // UIのロック解除（軽量化時のロック処理を解除）
            const controls = document.getElementById('controls');
            controls.style.pointerEvents = 'auto';
            controls.style.opacity = '1';

            const turnInfo = document.getElementById('turn-info');
            turnInfo.innerText = state.isYourTurn ? "★ あなたの番です ★" : `${state.currentPlayerName} の番です`;
            turnInfo.style.color = state.isYourTurn ? "#f1c40f" : "white";

            const statusBar = document.getElementById('status-bar');
            if (state.dabutoName) {
                statusBar.style.display = 'block';
                statusBar.innerText = `【最終周】${state.dabutoName} がダブト中！`;
            } else {
                statusBar.style.display = 'none'; // ラウンドが新しくなったら隠す
            }

            document.getElementById('deck-count').innerText = state.deckCount;

            selectedHand = null; selectedField = null;
            renderCards('field', state.field, (i) => { if (state.isYourTurn && !state.hasActed) { selectedField = selectedField === i ? null : i; updateSelection(); } });
            renderCards('hand', state.hand, (i) => { if (state.isYourTurn && !state.hasActed) { selectedHand = selectedHand === i ? null : i; updateSelection(); } });

            document.getElementById('score').innerText = calculateScore(state.hand);
            updateSelection();
        });

        function renderCards(id, cards, clickFn) {
            const div = document.getElementById(id);
            div.innerHTML = '';
            cards.forEach((c, i) => {
                const cardEl = document.createElement('div');
                cardEl.className = `card ${c.suit === '♥' || c.suit === '♦' ? 'red' : ''}`;
                if (!gameState.isYourTurn || gameState.hasActed) cardEl.classList.add('disabled');
                let rankStr = c.rank === 1 ? 'A' : c.rank === 11 ? 'J' : c.rank === 12 ? 'Q' : c.rank === 13 ? 'K' : c.rank;
                cardEl.innerText = c.suit + rankStr;
                cardEl.id = `card-${id}-${i}`;
                cardEl.onclick = () => clickFn(i);
                div.appendChild(cardEl);
            });
        }

        function updateSelection() {
            if (!gameState) return;
            document.querySelectorAll('.card').forEach(el => el.classList.remove('selected'));
            if (selectedField !== null) document.getElementById(`card-field-${selectedField}`).classList.add('selected');
            if (selectedHand !== null) document.getElementById(`card-hand-${selectedHand}`).classList.add('selected');

            const canAct = gameState.isYourTurn && !gameState.hasActed;
            document.getElementById('btn-exchange').disabled = !(canAct && selectedHand !== null && selectedField !== null);
            document.getElementById('btn-all').disabled = !canAct;
            document.getElementById('btn-pass').disabled = !canAct;
            document.getElementById('btn-dabuto').disabled = !(gameState.isYourTurn && calculateScore(gameState.hand) >= 60 && !gameState.dabutoName);
            document.getElementById('btn-finish').disabled = !(gameState.isYourTurn && gameState.hasActed);
        }

        function action(type) {
            const controls = document.getElementById('controls');
            controls.style.pointerEvents = 'none';
            controls.style.opacity = '0.5';
            connection.invoke("PerformAction", type, selectedHand, selectedField);
        }

        // サーバーから送られてくるスコア情報（連戦対応）
        connection.on("GameEnded", players => {
            document.getElementById('game').classList.add('hidden');
            document.getElementById('status-bar').style.display = 'none';
            document.getElementById('result-screen').classList.remove('hidden');

            let html = "<h3>ラウンド結果</h3>";
            // 降順（合計スコアが高い順）にソートして表示
            players.sort((a, b) => b.totalScore - a.totalScore).forEach(p => {
                let sign = p.lastScore > 0 ? "+" : "";
                html += `<p style="font-size: 1.2em; margin: 5px 0;"><strong>${p.name}</strong>: 累計 <strong>${p.totalScore}</strong> 点 <span style="font-size: 0.8em; color: #bdc3c7;">(今回 ${sign}${p.lastScore})</span></p>`;
            });
            document.getElementById('results').innerHTML = html;
        });

        // クライアント側は表示用としてのみ使用
        function calculateScore(hand) {
            let ranks = [...new Set(hand.map(c => c.rank))].sort((a, b) => a - b);
            if (ranks.length < 5) return 0;
            let extended = [...ranks, ...ranks.map(r => r + 13)].sort((a, b) => a - b);
            let straight = false;
            for (let i = 0; i <= extended.length - 5; i++) {
                if (extended[i + 4] === extended[i] + 4) { straight = true; break; }
            }
            if (!straight) return 0;
            let counts = {};
            hand.forEach(c => counts[c.suit] = (counts[c.suit] || 0) + 1);
            return Math.max(...Object.values(counts)) * 20;
        }
    </script>
</body>
</html>
